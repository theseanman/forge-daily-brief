<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jot a collision</title>
<style>
  :root{
    --bg-deep:#061c40; --bg-mid:#0d3572; --accent:#4a9de8; --accent-hi:#7fbfff;
    --ink:#eaf4ff; --ink-dim:rgba(234,244,255,.72); --ink-quiet:rgba(234,244,255,.5);
    --gold:#f5d76e;
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(ellipse at 50% -10%, #1e5aa8 0%, var(--bg-mid) 45%, var(--bg-deep) 100%);
    color:var(--ink); overscroll-behavior:none; }
  .wrap{ position:fixed; inset:0; display:flex; flex-direction:column; padding:22px 18px calc(24px + env(safe-area-inset-bottom)); overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .top{ text-align:center; }
  a.back{ color:var(--ink-quiet); text-decoration:none; font-size:12px; letter-spacing:.16em; text-transform:uppercase; font-weight:700; }
  .kicker{ font-size:11px; letter-spacing:.32em; text-transform:uppercase; color:var(--accent); font-weight:800; margin-top:10px; }
  .prompt{ font-size:14px; color:var(--ink-dim); margin-top:12px; line-height:1.5; max-width:560px; margin-left:auto; margin-right:auto; }
  .fields{ max-width:560px; margin:22px auto 0; width:100%; }
  .field{ margin-bottom:14px; }
  .label{ font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent-hi); font-weight:800; margin-bottom:6px; }
  textarea{ width:100%; min-height:64px; border-radius:12px; padding:12px 14px; font-size:15px; line-height:1.5; background:rgba(9,36,80,.55); border:2px solid rgba(74,157,232,.35); color:var(--ink); font-family:inherit; resize:vertical; -webkit-user-select:text; user-select:text; }
  textarea:focus{ outline:none; border-color:var(--accent); background:rgba(9,36,80,.75); }
  .bar{ display:flex; gap:10px; justify-content:center; margin-top:10px; max-width:560px; margin-left:auto; margin-right:auto; width:100%; }
  .btn{ flex:1; border:0; border-radius:999px; padding:13px; font-size:14px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; background:linear-gradient(135deg,#bfe7ff,#7fd4e6); color:#0b2547; box-shadow:0 4px 18px rgba(6,30,70,.35); }
  .btn.ghost{ background:rgba(9,36,80,.55); color:#fff; box-shadow:none; text-decoration:none; text-align:center; line-height:1; display:flex; align-items:center; justify-content:center; }
  .btn:disabled{ opacity:.35; cursor:default; }
  .status{ text-align:center; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent-hi); margin-top:10px; font-weight:700; opacity:0; transition:opacity .3s; }
  .status.on{ opacity:1; }
  .today{ max-width:560px; margin:22px auto 0; }
  .today .h{ font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-quiet); font-weight:800; margin-bottom:8px; }
  .row{ background:rgba(9,36,80,.4); border-left:3px solid rgba(74,157,232,.55); border-radius:10px; padding:10px 12px; margin-bottom:8px; }
  .row .rh{ font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-quiet); font-weight:700; margin-bottom:4px; }
  .row .rb{ font-size:14px; line-height:1.5; color:var(--ink); }
  .row .rb b{ color:var(--accent-hi); font-weight:700; }
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <a href="./" class="back">&larr; Brief</a>
    <div class="kicker" style="margin-top:10px;">Collision Jot</div>
    <div class="prompt">A moment where fear of looking bad collided with a hard line. Capture it now; the Sunday review will rehearse it.</div>
  </div>

  <div class="fields">
    <div class="field">
      <div class="label">The situation</div>
      <textarea id="f-sit" placeholder="What was happening"></textarea>
    </div>
    <div class="field">
      <div class="label">The value or hard line in play</div>
      <textarea id="f-val" placeholder="Which one, and how it collided"></textarea>
    </div>
    <div class="field">
      <div class="label">What the pre-decided response was</div>
      <textarea id="f-res" placeholder="What you did / should have done"></textarea>
    </div>
    <div class="bar">
      <a href="./" class="btn ghost">Cancel</a>
      <button type="button" class="btn" id="saveBtn" onclick="saveJot()">Save</button>
    </div>
    <div class="status" id="stat">Saved</div>
  </div>

  <div class="today" id="today"></div>
</div>

<script>
var K = 'forge-collision-jots';
var SYNC_URL = 'https://forge-sync.yoseanreid.workers.dev';

function ymd(d){ d=d||new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function readAll(){
  try{ var v = JSON.parse(localStorage.getItem(K) || '{}');
       return (v && typeof v === 'object' && !Array.isArray(v)) ? v : {}; }
  catch(e){ return {}; }
}
function writeAll(a){ try{ localStorage.setItem(K, JSON.stringify(a)); }catch(e){} }
function unionDay(a, b){
  var seen = {}, out = [];
  (a||[]).concat(b||[]).forEach(function(x){
    if (!x || typeof x !== 'object') return;
    var id = String(x.id || x.ts || '');
    if (!id || seen[id]) return;
    seen[id] = 1; out.push(x);
  });
  out.sort(function(x,y){ return (x.ts||0) - (y.ts||0); });
  if (out.length > 40) out = out.slice(-40);
  return out;
}
function pushCloud(all){
  try{ fetch(SYNC_URL + '/' + encodeURIComponent(K),
       { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(all) })
      .catch(function(){}); }catch(e){}
}
function pullCloud(){
  fetch(SYNC_URL + '/' + encodeURIComponent(K))
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(cloud){
      if (!cloud || typeof cloud !== 'object' || Array.isArray(cloud) || cloud.error) return;
      var all = readAll(), changed = false;
      for (var dk in cloud){
        if (!cloud.hasOwnProperty(dk)) continue;
        var cc = cloud[dk]; if (!cc || typeof cc !== 'object') continue;
        var cJ = Array.isArray(cc.j) ? cc.j : [];
        var lJ = (all[dk] && Array.isArray(all[dk].j)) ? all[dk].j : [];
        var u = unionDay(lJ, cJ);
        if (u.length !== lJ.length){ all[dk] = { j: u }; changed = true; }
      }
      if (changed){ writeAll(all); paintToday(); }
    }).catch(function(){});
}
function saveJot(){
  var s = document.getElementById('f-sit').value.trim();
  var v = document.getElementById('f-val').value.trim();
  var r = document.getElementById('f-res').value.trim();
  if (!s && !v && !r) return;
  var all = readAll(); var dk = ymd();
  var day = (all[dk] && Array.isArray(all[dk].j)) ? all[dk].j : [];
  var d = new Date();
  var entry = { ts: Date.now(),
                id: String(Date.now()) + '-' + Math.floor(Math.random() * 1000000),
                hm: ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2),
                s: s, v: v, r: r };
  day.push(entry);
  if (day.length > 40) day = day.slice(-40);
  all[dk] = { j: day };
  /* keep only last 60 days */
  var keys = Object.keys(all).sort();
  if (keys.length > 60){ var o = {}; keys.slice(-60).forEach(function(k){ o[k] = all[k]; }); all = o; }
  writeAll(all); pushCloud(all);
  document.getElementById('f-sit').value = '';
  document.getElementById('f-val').value = '';
  document.getElementById('f-res').value = '';
  var st = document.getElementById('stat'); st.className = 'status on';
  setTimeout(function(){ st.className = 'status'; }, 1400);
  paintToday();
}
function paintToday(){
  var host = document.getElementById('today'); if (!host) return;
  var all = readAll(); var dk = ymd();
  var day = (all[dk] && Array.isArray(all[dk].j)) ? all[dk].j : [];
  if (!day.length){ host.innerHTML = ''; return; }
  var html = '<div class="h">Today &middot; ' + day.length + ' capture' + (day.length===1?'':'s') + '</div>';
  day.slice().reverse().forEach(function(e){
    var rh = e.hm || '';
    var body = '';
    if (e.s) body += '<b>Situation:</b> ' + esc(e.s) + '<br>';
    if (e.v) body += '<b>Value:</b> ' + esc(e.v) + '<br>';
    if (e.r) body += '<b>Response:</b> ' + esc(e.r);
    html += '<div class="row"><div class="rh">' + rh + '</div><div class="rb">' + body + '</div></div>';
  });
  host.innerHTML = html;
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function boot(){
  paintToday();
  try{ pullCloud(); }catch(e){}
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
</script>

</body>
</html>
