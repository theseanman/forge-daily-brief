<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>FORGE Day Plan</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(135deg, #d84315 0%, #ff9800 50%, #ffc107 100%);
      font-family: -apple-system, sans-serif;
      min-height: 100vh; padding: 18px; color: #0d0d0d;
    }
    .shell { max-width: 560px; margin: 0 auto; padding-bottom: 40px; }
    h1 { font-size: 22px; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 4px; }
    .date { font-size: 14px; font-weight: 600; color: #5a2a00; margin-bottom: 10px; }

    .ctxbar {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      font-size: 11px; font-weight: 700; color: #5a2a00; margin-bottom: 12px;
    }
    .ctxbar .jar { background: rgba(255,255,255,0.45); padding: 4px 8px; border-radius: 6px; }

    .daytabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .daytab {
      flex: 1; padding: 10px; border: 3px solid #0d0d0d; border-radius: 10px;
      background: rgba(255,255,255,0.25); font-weight: 800; font-size: 14px;
      text-align: center; cursor: pointer; touch-action: manipulation;
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    .daytab.active { background: #0d0d0d; color: #ffc107; }

    .nextbar {
      background: rgba(0,0,0,0.88); color: #ffc107; border-radius: 10px;
      padding: 12px 14px; margin-bottom: 14px;
    }
    .nextbar .lbl { font-size: 10px; letter-spacing: 0.18em; opacity: 0.75; margin-bottom: 4px; }
    .nextbar .val { font-size: 17px; font-weight: 800; line-height: 1.35; }

    .banner {
      background: rgba(0,0,0,0.85); color: #ffc107; font-weight: 800; font-size: 15px;
      padding: 12px 14px; border-radius: 10px; margin-bottom: 16px; letter-spacing: 0.04em;
    }
    .allday {
      background: rgba(255,255,255,0.4); border: 2px solid #0d0d0d; border-radius: 10px;
      padding: 10px 12px; margin-bottom: 14px; font-size: 13px; font-weight: 600; display: none;
    }

    .sect { margin-bottom: 18px; }
    .sect-h {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 13px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase;
      margin-bottom: 8px; color: #0d0d0d;
    }
    .sect-h .hint { font-size: 10px; font-weight: 600; letter-spacing: 0; color: #5a2a00; text-transform: none; }
    .panel {
      background: rgba(255,255,255,0.22); border: 3px solid #0d0d0d;
      border-radius: 12px; padding: 8px; overflow: hidden;
    }

    .t5row { display: flex; align-items: center; gap: 6px; padding: 2px 4px; }
    .t5num { width: 20px; font-weight: 800; font-size: 14px; flex-shrink: 0; }
    .t5chk {
      width: 26px; height: 26px; flex-shrink: 0; border: 2px solid #0d0d0d; border-radius: 6px;
      background: rgba(255,255,255,0.6); font-size: 15px; font-weight: 800; line-height: 1;
      cursor: pointer; touch-action: manipulation; padding: 0;
    }
    .t5chk.on { background: #0d0d0d; color: #ffc107; }
    .t5txt {
      flex: 1; min-width: 0; border: none; background: rgba(255,255,255,0.55);
      border-radius: 6px; padding: 8px; font-size: 15px; font-family: inherit; color: #0d0d0d;
    }
    .t5txt.done { text-decoration: line-through; opacity: 0.55; }
    .t5hr {
      width: 78px; flex-shrink: 0; border: 2px solid #0d0d0d; border-radius: 6px;
      background: rgba(255,255,255,0.6); font-size: 13px; font-weight: 700;
      font-family: inherit; padding: 6px 2px; color: #0d0d0d;
    }
    .t5row.past .t5hr { background: #ffe0b2; }

    .li { display: flex; align-items: center; gap: 6px; padding: 6px 4px; border-bottom: 1px solid rgba(0,0,0,0.15); }
    .li:last-child { border-bottom: none; }
    .li-txt { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; word-break: break-word; }
    .li-btn {
      flex-shrink: 0; border: 2px solid #0d0d0d; border-radius: 6px; background: rgba(255,255,255,0.6);
      font-size: 12px; font-weight: 800; padding: 5px 8px; cursor: pointer; touch-action: manipulation;
      font-family: inherit; color: #0d0d0d;
    }
    .li-btn.go { background: #0d0d0d; color: #ffc107; }
    .addrow { display: flex; gap: 6px; padding: 8px 4px 4px; }
    .addrow input {
      flex: 1; min-width: 0; border: 2px solid #0d0d0d; border-radius: 6px;
      background: rgba(255,255,255,0.7); padding: 8px; font-size: 14px; font-family: inherit; color: #0d0d0d;
    }
    .empty { font-size: 13px; font-weight: 600; color: #5a2a00; padding: 10px 4px; font-style: italic; }

    .row { display: flex; align-items: stretch; border-bottom: 1px solid rgba(0,0,0,0.18); }
    .row:last-child { border-bottom: none; }
    .row.now { background: rgba(0,0,0,0.85); border-radius: 8px; }
    .row.now .hr { color: #ffc107; }
    .hr { width: 62px; flex-shrink: 0; font-size: 13px; font-weight: 800; padding: 10px 6px; }
    .cell { flex: 1; min-width: 0; padding: 6px 4px; }
    .cell input {
      width: 100%; border: none; background: transparent; font-size: 15px;
      font-family: inherit; color: #0d0d0d; padding: 4px 2px;
    }
    .row.now .cell input { color: #ffc107; }
    .chip {
      display: block; font-size: 12px; font-weight: 700; background: rgba(255,255,255,0.55);
      border-radius: 5px; padding: 3px 6px; margin-bottom: 3px; word-break: break-word;
    }
    .chip.task { background: #0d0d0d; color: #ffc107; }
    .chip.task.done { opacity: 0.5; text-decoration: line-through; }

    .btn-secondary {
      display: block; width: 100%; margin-top: 10px; padding: 12px;
      background: rgba(255,255,255,0.3); border: 3px solid #0d0d0d; font-weight: 800;
      font-size: 14px; border-radius: 12px; cursor: pointer; touch-action: manipulation;
      font-family: inherit; color: #0d0d0d;
    }
    .btn-row { display: flex; gap: 8px; margin-top: 10px; }
    .btn-row .btn-secondary { margin-top: 0; }
    .back-link {
      display: block; text-align: center; margin-top: 14px; font-size: 15px; font-weight: 700;
      color: #0d0d0d; text-decoration: none; border-bottom: 2px solid #0d0d0d;
    }
    .saved { font-size: 12px; font-weight: 600; color: #1b5e20; text-align: center; margin-top: 10px; min-height: 16px; }
    .warn {
      background: #b71c1c; color: #fff; border-radius: 10px; padding: 10px 12px;
      font-size: 13px; font-weight: 700; margin-bottom: 12px; display: none;
    }
    .warn button {
      margin-top: 8px; background: #fff; color: #b71c1c; border: none; border-radius: 6px;
      padding: 7px 10px; font-weight: 800; font-size: 13px; font-family: inherit;
      cursor: pointer; touch-action: manipulation;
    }

    .t5block { border-bottom: 1px solid rgba(0,0,0,0.18); padding: 6px 0 8px; }
    .t5block:last-child { border-bottom: none; }
    .t5row2 { display: flex; align-items: center; gap: 6px; padding: 5px 4px 0 26px; }
    .t5mins {
      width: 66px; flex-shrink: 0; border: 2px solid #0d0d0d; border-radius: 6px;
      background: rgba(255,255,255,0.6); font-size: 13px; font-weight: 700;
      font-family: inherit; padding: 6px 4px; color: #0d0d0d; text-align: center;
    }
    .t5dw {
      flex: 1; min-width: 0; border: 2px solid #0d0d0d; border-radius: 6px;
      background: rgba(255,255,255,0.45); padding: 6px 8px; font-size: 13px;
      font-family: inherit; color: #0d0d0d;
    }
    .t5dw::placeholder { font-style: italic; opacity: 0.6; }

    .sessionbox {
      background: rgba(0,0,0,0.88); color: #ffc107; border-radius: 12px;
      padding: 14px; margin-bottom: 14px;
    }
    .sessionbox.ringing { background: #8a1010; color: #fff; }
    .sess-lbl { font-size: 10px; letter-spacing: 0.18em; opacity: 0.75; margin-bottom: 6px; }
    .sess-task { font-size: 15px; font-weight: 800; line-height: 1.35; margin-bottom: 2px; }
    .sess-dw { font-size: 12px; opacity: 0.85; line-height: 1.45; margin-bottom: 10px; }
    .sess-clock { font-size: 40px; font-weight: 800; letter-spacing: 0.04em; line-height: 1; margin-bottom: 10px; }
    .sess-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .sess-btn {
      flex: 1; min-width: 92px; border: 2px solid #ffc107; border-radius: 8px;
      background: transparent; color: #ffc107; font-weight: 800; font-size: 13px;
      padding: 10px 8px; cursor: pointer; touch-action: manipulation; font-family: inherit;
    }
    .sessionbox.ringing .sess-btn { border-color: #fff; color: #fff; }
    .sess-btn.solid { background: #ffc107; color: #0d0d0d; }
    .sessionbox.ringing .sess-btn.solid { background: #fff; color: #8a1010; }
    .sess-start {
      display: block; width: 100%; padding: 14px; background: rgba(0,0,0,0.88);
      color: #ffc107; border: none; border-radius: 12px; font-weight: 800;
      font-size: 15px; letter-spacing: 0.06em; cursor: pointer; touch-action: manipulation;
      font-family: inherit; margin-bottom: 14px;
    }
    .sess-pick { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .sess-pickbtn {
      border: 2px solid #ffc107; border-radius: 20px; background: transparent; color: #ffc107;
      font-size: 12px; font-weight: 700; padding: 6px 12px; cursor: pointer;
      touch-action: manipulation; font-family: inherit;
    }
    .statline { background: rgba(255,255,255,0.32); border-left: 4px solid #0d0d0d;
                border-radius: 8px; padding: 10px 12px; margin: 12px 0;
                font-size: 12px; line-height: 1.6; }
    .offline { background: rgba(255,255,255,0.22); border-radius: 8px; padding: 9px 12px;
               margin-bottom: 12px; font-size: 12px; font-weight: 600; line-height: 1.5; }
    .offline.off-due { background: rgba(170,30,15,0.32); }
    .offline.off-today { background: rgba(20,110,60,0.28); }
    .sound-link { display: block; text-align: center; font-size: 11px; font-weight: 700;
                  letter-spacing: 0.08em; color: #5a2a00; margin: -4px 0 12px;
                  cursor: pointer; touch-action: manipulation; }
    .sound-head { font-size: 11px; font-weight: 800; letter-spacing: 0.1em;
                  text-transform: uppercase; padding: 4px 4px 8px; }
    textarea.io {
      width: 100%; height: 120px; margin-top: 10px; border: 3px solid #0d0d0d; border-radius: 10px;
      padding: 8px; font-size: 12px; font-family: ui-monospace, monospace; display: none;
      background: rgba(255,255,255,0.75); color: #0d0d0d;
    }
  </style>
</head>
<body>
<div class="shell">
  <h1>&#127796; FORGE Day Plan</h1>
  <div class="date" id="date"></div>

  <div class="ctxbar">
    <span class="jar" id="jar">&nbsp;</span>
    <span class="jar" id="lastsave">&nbsp;</span>
  </div>

  <div class="warn" id="warn">
    <span id="warntext"></span>
    <button onclick="restoreBackup()">Restore last backup</button>
  </div>

  <div class="daytabs">
    <div class="daytab active" id="tab-today" onclick="setDay(0)">Today</div>
    <div class="daytab" id="tab-tom" onclick="setDay(1)">Tomorrow</div>
  </div>

  <div class="nextbar">
    <div class="lbl">NEXT ACTION</div>
    <div class="val" id="nextval">&mdash;</div>
  </div>

  <div id="session-host"></div>
  <div class="sound-link" onclick="openSoundPicker()">⚙ alarm sound</div>
  <div id="sound-host"></div>
  <div id="off-host"></div>

  <div class="banner" id="banner"></div>
  <div class="allday" id="allday"></div>

  <div class="sect">
    <div class="sect-h"><span>&#127919; Top 5 &mdash; <span id="t5day">Today</span></span><span class="hint">set an hour to place it below</span></div>
    <div class="panel" id="top5"></div>
  </div>



  <div class="sect">
    <div class="sect-h"><span>&#128336; Hour by Hour</span><span class="hint">nothing is ever removed</span></div>
    <div class="grid panel" id="grid"></div>
  </div>

  <div class="sect">
    <div class="sect-h"><span>&#127968; Family &amp; Fun</span><span class="hint">pick one most days</span></div>
    <div class="panel" id="fun"></div>
  </div>

  <div class="sect">
    <div class="sect-h"><span>&#128203; Backlog</span><span class="hint" id="blsrc">everything on the list</span></div>
    <div class="panel" id="backlog"></div>
  </div>

  <div id="stats-host"></div>

  <div class="saved" id="saved"></div>
  <div id="sync-badge" style="font-size:11px; letter-spacing:0.08em; margin:4px 0 8px; min-height:16px;"></div>

  <div class="btn-row">
    <button class="btn-secondary" onclick="toggleIO()">Backup / Restore</button>
    <button class="btn-secondary" onclick="clearDay()">Clear this day</button>
  </div>
  <textarea class="io" id="io" spellcheck="false"></textarea>
  <div class="btn-row" id="iobtns" style="display:none;">
    <button class="btn-secondary" onclick="copyIO()">Copy</button>
    <button class="btn-secondary" onclick="importIO()">Restore from text</button>
  </div>

  <a href="https://theseanman.github.io/forge-daily-brief" class="back-link">&larr; Back to Brief</a>
</div>

<script>
var START_HOUR = 6, END_HOUR = 23;
var TRAINING = { 0:'HIIT', 1:'Lift', 2:'HIIT', 3:'Lift', 4:'HIIT', 5:'Lift', 6:'Rest' };
var REMINDERS_URL = 'https://forge-input.yoseanreid.workers.dev/reminders';

var K_PLAN = 'forge-dayplan';
var K_TOP5 = 'forge-top5';
var K_BACKLOG = 'forge-backlog';
var K_FUN = 'forge-fun';
var K_BACKUP = 'forge-backup';

/* ---------- cloud sync ---------- */
var SYNC_URL = 'https://forge-sync.yoseanreid.workers.dev';
var SYNC_KEYS = [K_TOP5, K_PLAN, K_BACKLOG, K_FUN, 'forge-week-rocks'];

function syncBadge(state) {
  var el = document.getElementById('sync-badge');
  if (!el) return;
  if (state === 'synced')       { el.textContent = '\u2601\uFE0F synced';  el.style.color = '#4ae8a0'; }
  else if (state === 'pushing') { el.textContent = '\u2601\uFE0F pushing\u2026'; el.style.color = '#aab'; }
  else if (state === 'pulling') { el.textContent = '\u2601\uFE0F pulling\u2026'; el.style.color = '#aab'; }
  else if (state === 'offline') { el.textContent = '\u26A0\uFE0F offline'; el.style.color = '#ff6b6b'; }
  else if (state === 'partial') { el.textContent = '\u26A0\uFE0F partial'; el.style.color = '#ffc94a'; }
  else { el.textContent = ''; }
}

function syncPush(key) {
  var val = localStorage.getItem(key);
  if (!val) return;
  syncBadge('pushing');
  fetch(SYNC_URL + '/' + encodeURIComponent(key), {
    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: val
  }).then(function(r) { syncBadge(r.ok ? 'synced' : 'offline'); })
    .catch(function() { syncBadge('offline'); });
}

function syncPull(cb) {
  var pulled = 0, errors = 0, total = SYNC_KEYS.length;
  syncBadge('pulling');
  SYNC_KEYS.forEach(function(key) {
    fetch(SYNC_URL + '/' + encodeURIComponent(key))
      .then(function(r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(cloud) {
        if (cloud && typeof cloud === 'object') {
          if (Array.isArray(cloud)) {
            var local = readJSON(key, []);
            if (!Array.isArray(local)) local = [];
            var changed = false;
            cloud.forEach(function(item) { if (local.indexOf(item) === -1) { local.push(item); changed = true; } });
            if (changed) writeJSON(key, local);
          } else {
            var local = readJSON(key, {});
            if (typeof local !== 'object' || Array.isArray(local)) local = {};
            var changed = false;
            for (var dk in cloud) {
              if (cloud.hasOwnProperty(dk) && JSON.stringify(local[dk]) !== JSON.stringify(cloud[dk])) {
                local[dk] = cloud[dk]; changed = true;
              }
            }
            if (changed) writeJSON(key, local);
          }
        }
        pulled++;
        if (pulled + errors === total) { syncBadge(errors ? 'partial' : 'synced'); if (cb) cb(); }
      })
      .catch(function() {
        errors++;
        if (pulled + errors === total) { syncBadge(errors === total ? 'offline' : 'partial'); if (cb) cb(); }
      });
  });
}

var dayOffset = 0;

/* ---------- date helpers ---------- */
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function viewDate(){ var d = new Date(); d.setDate(d.getDate() + dayOffset); return d; }
function dayKey(){ return ymd(viewDate()); }
function isToday(){ return dayOffset === 0; }
function hourLabel(h){ var ap = h < 12 ? 'AM' : 'PM'; var hr = h % 12; if (hr === 0) hr = 12; return hr + ' ' + ap; }

/* ---------- storage ---------- */
function readJSON(key, fallback){
  try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function writeJSON(key, val){
  try { localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch(e){ return false; }
}
function loadPlan(){ var all = readJSON(K_PLAN, {}); return all[dayKey()] || {}; }
function savePlan(plan){
  var all = readJSON(K_PLAN, {});
  all[dayKey()] = plan;
  var ok = writeJSON(K_PLAN, prune(all));
  afterSave(ok);
}
  syncPush(K_PLAN);
function loadTop5(){
  var all = readJSON(K_TOP5, {});
  var arr = all[dayKey()];
  if (!arr || arr.length !== 5) {
    arr = [];
    for (var i = 0; i < 5; i++) arr.push({ t:'', h:'', done:false });
  }
  return arr;
}
function saveTop5(arr){
  var all = readJSON(K_TOP5, {});
  all[dayKey()] = arr;
  var ok = writeJSON(K_TOP5, prune(all));
  afterSave(ok);
}
  syncPush(K_TOP5);
function loadList(key){ var a = readJSON(key, []); return Object.prototype.toString.call(a) === '[object Array]' ? a : []; }
function saveList(key, arr){ afterSave(writeJSON(key, arr)); syncPush(key); }

/* keep 21 days of history; never delete silently beyond that */
function prune(all){
  var keys = [];
  for (var k in all) if (all.hasOwnProperty(k)) keys.push(k);
  if (keys.length <= 21) return all;
  keys.sort();
  var out = {};
  for (var i = keys.length - 21; i < keys.length; i++) out[keys[i]] = all[keys[i]];
  return out;
}

/* ---------- backup ---------- */
function snapshot(){
  return {
    saved: new Date().toISOString(),
    plan: readJSON(K_PLAN, {}),
    top5: readJSON(K_TOP5, {}),
    backlog: loadList(K_BACKLOG),
    fun: loadList(K_FUN)
  };
}
function afterSave(ok){
  if (ok === false){ flashSaved(false); return; }
  writeJSON(K_BACKUP, snapshot());
  flashSaved(true);
  paintMeta();
}
function restoreBackup(){
  var b = readJSON(K_BACKUP, null);
  if (!b) { alert('No backup found in this browser.'); return; }
  if (!confirm('Restore the last backup from ' + new Date(b.saved).toLocaleString() + '? Anything currently here will be replaced.')) return;
  writeJSON(K_PLAN, b.plan || {});
  writeJSON(K_TOP5, b.top5 || {});
  writeJSON(K_BACKLOG, b.backlog || []);
  writeJSON(K_FUN, b.fun || []);
  document.getElementById('warn').style.display = 'none';
  renderAll();
}

/* ---------- context badge ---------- */
function isStandalone(){
  try {
    if (window.navigator && window.navigator.standalone === true) return true;
    if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true;
  } catch(e){}
  return false;
}
function paintMeta(){
  document.getElementById('jar').textContent = isStandalone() ? 'HOME-SCREEN APP' : 'BROWSER TAB';
  var b = readJSON(K_BACKUP, null);
  document.getElementById('lastsave').textContent = b && b.saved
    ? 'saved ' + new Date(b.saved).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})
    : 'no saves yet';
}
function checkEmptyWarning(){
  var w = document.getElementById('warn');
  var b = readJSON(K_BACKUP, null);
  var plan = loadPlan();
  var t5 = loadTop5();
  var planEmpty = true; for (var k in plan) if (plan[k]) planEmpty = false;
  var t5Empty = true; for (var i = 0; i < 5; i++) if (t5[i].t) t5Empty = false;
  if (planEmpty && t5Empty && b && (Object.keys(b.plan||{}).length || Object.keys(b.top5||{}).length)) {
    document.getElementById('warntext').textContent =
      'This day looks empty, but a backup exists from ' + new Date(b.saved).toLocaleString() + '.';
    w.style.display = 'block';
  } else {
    w.style.display = 'none';
  }
}

/* ---------- Top 5 ---------- */
function hourOptions(sel){
  var s = '<option value="">--</option>';
  for (var h = START_HOUR; h <= END_HOUR; h++){
    s += '<option value="' + h + '"' + (String(sel) === String(h) ? ' selected' : '') + '>' + hourLabel(h) + '</option>';
  }
  return s;
}
function renderTop5(){
  var arr = loadTop5();
  var nowH = new Date().getHours();
  var host = document.getElementById('top5');
  host.innerHTML = '';
  for (var i = 0; i < 5; i++){
    (function(i){
      var it = arr[i];
      var row = document.createElement('div');
      row.className = 't5row' + (isToday() && it.h !== '' && Number(it.h) < nowH && !it.done ? ' past' : '');

      var num = document.createElement('div');
      num.className = 't5num'; num.textContent = (i + 1);

      var chk = document.createElement('button');
      chk.className = 't5chk' + (it.done ? ' on' : '');
      chk.innerHTML = it.done ? '&#10003;' : '&nbsp;';
      chk.onclick = function(){ var a = loadTop5(); a[i].done = !a[i].done; saveTop5(a); renderTop5(); paintNext(); paintChips(); };

      var txt = document.createElement('input');
      txt.type = 'text'; txt.className = 't5txt' + (it.done ? ' done' : '');
      txt.value = it.t; txt.placeholder = 'actionable ' + (i + 1);
      txt.oninput = function(){ var a = loadTop5(); a[i].t = this.value; saveTop5(a); paintNext(); paintChips(); };
      txt.onblur = function(){ paintChips(); };

      var sel = document.createElement('select');
      sel.className = 't5hr';
      sel.innerHTML = hourOptions(it.h);
      sel.onchange = function(){ var a = loadTop5(); a[i].h = this.value; saveTop5(a); renderTop5(); paintNext(); paintChips(); };

      row.appendChild(num); row.appendChild(chk); row.appendChild(txt); row.appendChild(sel);

      var row2 = document.createElement('div');
      row2.className = 't5row2';

      var mins = document.createElement('input');
      mins.type = 'number'; mins.className = 't5mins'; mins.min = '5'; mins.max = '180';
      mins.placeholder = 'min'; mins.value = (it.m === undefined || it.m === null) ? '' : it.m;
      mins.oninput = function(){
        var a = loadTop5(); a[i].m = this.value === '' ? '' : Number(this.value); saveTop5(a);
      };

      var dw = document.createElement('input');
      dw.type = 'text'; dw.className = 't5dw';
      dw.value = it.dw || '';
      dw.placeholder = 'done when \u2026 (what would someone else see?)';
      dw.oninput = function(){ var a = loadTop5(); a[i].dw = this.value; saveTop5(a); };

      row2.appendChild(mins); row2.appendChild(dw);

      var block = document.createElement('div');
      block.className = 't5block';
      block.appendChild(row); block.appendChild(row2);
      host.appendChild(block);
    })(i);
  }
  document.getElementById('t5day').textContent = isToday() ? 'Today' : 'Tomorrow';
}
function paintNext(){
  var arr = loadTop5();
  var nowH = new Date().getHours();
  var timed = [], untimed = [];
  for (var i = 0; i < 5; i++){
    var it = arr[i];
    if (!it.t || it.done) continue;
    if (it.h !== '' && it.h !== null) timed.push(it); else untimed.push(it);
  }
  timed.sort(function(a,b){ return Number(a.h) - Number(b.h); });
  var pick = null;
  if (isToday()){
    for (var j = 0; j < timed.length; j++){ if (Number(timed[j].h) >= nowH){ pick = timed[j]; break; } }
    if (!pick && timed.length) pick = timed[0];
  } else if (timed.length) {
    pick = timed[0];
  }
  if (!pick && untimed.length) pick = untimed[0];
  var el = document.getElementById('nextval');
  if (!pick){
    var anyText = false;
    for (var k = 0; k < 5; k++) if (arr[k].t) anyText = true;
    el.innerHTML = anyText ? 'All five done. &#127881;' : 'Set your five below.';
  } else {
    el.textContent = (pick.h !== '' ? hourLabel(Number(pick.h)) + ' — ' : '') + pick.t;
  }
}

/* ---------- lists ---------- */

function promote(text){
  var a = loadTop5();
  for (var i = 0; i < 5; i++){
    if (!a[i].t){ a[i].t = text; saveTop5(a); renderTop5(); paintNext(); paintChips(); return; }
  }
  alert('All five slots are full. Clear one first.');
}

/* ---------- hour grid ---------- */
window.FORGE_EVENTS = {};
window.FORGE_ALLDAY = [];

var gridCells = {};
var gridInputs = {};
var pendingRebuild = false;

function isEditing(){
  var a = document.activeElement;
  return !!(a && (a.tagName === 'INPUT' || a.tagName === 'SELECT' || a.tagName === 'TEXTAREA'));
}

/* Full rebuild of the hour grid. Only safe when nothing has focus. */
function buildGrid(){
  var plan = loadPlan();
  var nowH = new Date().getHours();
  var grid = document.getElementById('grid');
  if (!grid) return;
  grid.innerHTML = '';
  gridCells = {}; gridInputs = {};
  for (var h = START_HOUR; h <= END_HOUR; h++){
    (function(h){
      var row = document.createElement('div');
      row.className = 'row' + (isToday() && h === nowH ? ' now' : '');
      var lab = document.createElement('div');
      lab.className = 'hr'; lab.textContent = hourLabel(h);
      var cell = document.createElement('div');
      cell.className = 'cell';

      var inp = document.createElement('input');
      inp.type = 'text';
      inp.placeholder = (isToday() && h === nowH ? 'now \u2014' : '');
      if (plan[h]) inp.value = plan[h];
      inp.oninput = function(){
        var p = loadPlan();
        if (this.value === '') delete p[h]; else p[h] = this.value;
        savePlan(p);
      };
      inp.onblur = function(){
        if (pendingRebuild && !isEditing()){ pendingRebuild = false; buildGrid(); }
      };
      cell.appendChild(inp);
      row.appendChild(lab); row.appendChild(cell);
      grid.appendChild(row);
      gridCells[h] = cell; gridInputs[h] = inp;
    })(h);
  }
  paintChips();
}

/* Update only the chips. Never touches the text inputs, so it is safe mid-typing. */
function paintChips(){
  var t5 = loadTop5();
  for (var h = START_HOUR; h <= END_HOUR; h++){
    var cell = gridCells[h];
    if (!cell) continue;
    var old = cell.querySelectorAll('.chip');
    for (var j = 0; j < old.length; j++) cell.removeChild(old[j]);
    var inp = gridInputs[h];
    var evs = window.FORGE_EVENTS[h] || [];
    for (var e = 0; e < evs.length; e++){
      var c = document.createElement('span');
      c.className = 'chip'; c.textContent = '\uD83D\uDCC5 ' + evs[e];
      cell.insertBefore(c, inp);
    }
    for (var i = 0; i < 5; i++){
      if (t5[i].t && String(t5[i].h) === String(h)){
        var tc = document.createElement('span');
        tc.className = 'chip task' + (t5[i].done ? ' done' : '');
        tc.textContent = '\u25B6 ' + (i + 1) + '. ' + t5[i].t;
        cell.insertBefore(tc, inp);
      }
    }
  }
}

/* Safe entry point: rebuild only when idle, otherwise just refresh chips. */
function renderGrid(){
  if (isEditing()){ pendingRebuild = true; paintChips(); return; }
  buildGrid();
}

/* ---------- calendar auto-fill ---------- */
function calLabel(){
  var d = viewDate();
  var wd = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
  var mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
  return wd + ' ' + mo + ' ' + String(d.getDate()).padStart(2,'0');
}
function parseHour(t){
  var m = /^(\d{1,2}):(\d{2})\s*(AM|PM)$/i.exec((t||'').trim());
  if (!m) return null;
  var h = parseInt(m[1],10) % 12;
  if (/PM/i.test(m[3])) h += 12;
  return h;
}
function renderAllDay(){
  var el = document.getElementById('allday');
  if (!window.FORGE_ALLDAY.length){ el.style.display = 'none'; el.textContent = ''; return; }
  el.style.display = 'block';
  el.textContent = '\uD83D\uDCC5 All day: ' + window.FORGE_ALLDAY.join('  \u00B7  ');
}
function fetchCalendar(){
  fetch('data.json?t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      var cal = (d && d.calendar) || [];
      var label = calLabel();
      window.FORGE_EVENTS = {}; window.FORGE_ALLDAY = [];
      cal.forEach(function(e){
        if (e.date !== label) return;
        if ((e.time||'').toLowerCase() === 'all day'){ window.FORGE_ALLDAY.push(e.title); return; }
        var h = parseHour(e.time);
        if (h === null) return;
        if (h < START_HOUR) h = START_HOUR;
        if (h > END_HOUR) h = END_HOUR;
        (window.FORGE_EVENTS[h] = window.FORGE_EVENTS[h] || []).push(e.time.replace(/^0/,'') + '  ' + e.title);
      });
      renderAllDay(); renderGrid();
    })
    .catch(function(){ /* offline — planner still works */ });
}

/* ---------- reminders -> backlog: MIRRORS the list, not append-only ------
   Items you typed here yourself, and remainders parked by the timer, are
   never touched. Only items that came from Reminders are removed when they
   disappear from Reminders.                                                */
var K_RSEEN = 'forge-reminders-seen';

function fetchReminders(){
  fetch(REMINDERS_URL, { headers: { 'Accept':'application/json' } })
    .then(function(r){ return r.json(); })
    .then(function(d){
      var text = (d && d.week) || '';
      var items = text.split('\n').map(function(x){ return x.trim(); }).filter(function(x){ return x; });
      var seen = readJSON(K_RSEEN, null);
      var existing = loadList(K_BACKLOG);
      var removed = 0, added = 0;

      if (seen === null){
        items.forEach(function(it){
          if (existing.indexOf(it) === -1){ existing.push(it); added++; }
        });
        writeJSON(K_RSEEN, items);
        saveList(K_BACKLOG, existing);
        renderLists();
        document.getElementById('blsrc').textContent = 'baseline set \u2014 deletions sync from now on';
        return;
      }

      var seenSet = {}, nowSet = {};
      seen.forEach(function(x){ seenSet[x] = 1; });
      items.forEach(function(x){ nowSet[x] = 1; });

      var kept = existing.filter(function(x){
        if (!seenSet[x]) return true;
        if (nowSet[x]) return true;
        removed++; return false;
      });
      items.forEach(function(it){
        if (kept.indexOf(it) === -1){ kept.push(it); added++; }
      });

      writeJSON(K_RSEEN, items);
      if (added || removed){ saveList(K_BACKLOG, kept); renderLists(); }
      var msg = 'synced from Reminders';
      if (added || removed){
        msg += ' (' + (added ? '+' + added : '') + (added && removed ? ', ' : '') +
               (removed ? '\u2212' + removed : '') + ')';
      }
      document.getElementById('blsrc').textContent = msg;
    })
    .catch(function(){
      document.getElementById('blsrc').textContent = 'manual list';
    });
}


/* ================= WORK SESSION TIMER ==================================== */
/* The break is a decision checkpoint, not just a rest. When the clock runs
   out the only question is whether the done-when condition is met.          */
var K_SESSION = 'forge-session';
var DEFAULT_MINS = 50;
var BREAK_MINS = 12;
var _tick = null, _rang = false, _origTitle = document.title;

function loadSession(){ return readJSON(K_SESSION, null); }
function saveSession(v){
  if (v === null){ try { localStorage.removeItem(K_SESSION); } catch(e){} }
  else { writeJSON(K_SESSION, v); }
}
function mmss(ms){
  if (ms < 0) ms = 0;
  var t = Math.round(ms / 1000);
  var m = Math.floor(t / 60), sec = t % 60;
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}
function firstUnfinished(){
  var a = loadTop5();
  for (var i = 0; i < 5; i++) if (a[i].t && !a[i].done) return i;
  return -1;
}

/* ---------- starting ---------- */
function startPrompt(){
  unlockAudio();
  var idx = firstUnfinished();
  var a = loadTop5();
  var label = idx >= 0 ? a[idx].t : '';
  var task = prompt('What are you working on?', label);
  if (task === null) return;
  task = task.trim();
  if (!task) return;

  var preMins = (idx >= 0 && a[idx].m) ? a[idx].m : DEFAULT_MINS;
  var mRaw = prompt('How many minutes?\n\n(50 is a good default for demanding work.)', String(preMins));
  if (mRaw === null) return;
  var mins = parseInt(mRaw, 10);
  if (!mins || mins < 1) mins = DEFAULT_MINS;

  var preDw = (idx >= 0 && a[idx].dw) ? a[idx].dw : '';
  var dw = prompt('Done when what?\n\nWrite something someone else could check.\nNot "make it good" \u2014 "ten decks generated and validated".', preDw);
  if (dw === null) return;
  dw = dw.trim();

  /* write it back onto the Top 5 item so it is not lost */
  if (idx >= 0){
    a[idx].m = mins;
    if (dw) a[idx].dw = dw;
    saveTop5(a);
    renderTop5();
  }

  var now = Date.now();
  saveSession({ task: task, mins: mins, dw: dw, startedAt: now, firstStartedAt: now,
                blocks: 1, kind: 'work', wasKeystone: (idx >= 0 && !!a[idx].k) });
  _rang = false;
  renderSession();
}

function startBreak(){
  unlockAudio();
  saveSession({ task: 'Break \u2014 get away from the screen', mins: BREAK_MINS, dw: '',
                startedAt: Date.now(), kind: 'break' });
  _rang = false;
  renderSession();
}

function endSession(){
  saveSession(null);
  _rang = false;
  document.title = _origTitle;
  renderSession();
}

/* ---------- the checkpoint ---------- */
function checkpoint(){
  var s = loadSession();
  if (!s) return;
  if (s.kind === 'break'){ endSession(); return; }

  var q = s.dw ? ('Done when: ' + s.dw + '\n\nIs that met?') : 'Is the task finished?';
  if (confirm(q + '\n\nOK = yes, finished.\nCancel = not yet.')){
    var idx = firstUnfinished();
    var a = loadTop5();
    if (idx >= 0 && a[idx].t === s.task){ a[idx].done = true; saveTop5(a); }
    logSession(s, true);
    endSession();
    renderAll();
    alert('Finished. Take the break \u2014 away from the screen.');
    startBreak();
    return;
  }
  /* not met: another block, or park it */
  if (confirm('Not met.\n\nOK = one more block (same length).\nCancel = park the rest in the backlog and stop.')){
    saveSession({ task: s.task, mins: s.mins, dw: s.dw, startedAt: Date.now(),
                  firstStartedAt: s.firstStartedAt || s.startedAt,
                  blocks: (s.blocks || 1) + 1, kind: 'work', wasKeystone: s.wasKeystone });
    _rang = false;
    renderSession();
  } else {
    var note = prompt('What is left? This goes to the backlog.', s.task + ' \u2014 remaining: ');
    if (note && note.trim()){
      var b = loadList(K_BACKLOG);
      if (b.indexOf(note.trim()) === -1){ b.push(note.trim()); saveList(K_BACKLOG, b); }
      renderLists();
    }
    logSession(s, false);
    endSession();
    startBreak();
  }
}

/* ---------- rendering ---------- */
function renderSession(){
  var host = document.getElementById('session-host');
  if (!host) return;
  var s = loadSession();

  if (!s){
    host.innerHTML = '';
    var b = document.createElement('button');
    b.className = 'sess-start';
    b.innerHTML = '\u25B6 START WORK';
    b.onclick = startPrompt;
    host.appendChild(b);
    var br = document.createElement('button');
    br.className = 'sess-start';
    br.style.background = 'rgba(255,255,255,0.30)';
    br.style.color = '#0d0d0d';
    br.innerHTML = '\u2615 Just take a break (' + BREAK_MINS + ' min)';
    br.onclick = startBreak;
    host.appendChild(br);
    if (_tick){ clearInterval(_tick); _tick = null; }
    document.title = _origTitle;
    return;
  }

  var left = (s.startedAt + s.mins * 60000) - Date.now();
  var over = left <= 0;

  host.innerHTML =
    '<div class="sessionbox' + (over ? ' ringing' : '') + '">' +
      '<div class="sess-lbl">' + (s.kind === 'break' ? 'BREAK' : 'WORKING ON') + '</div>' +
      '<div class="sess-task"></div>' +
      (s.dw ? '<div class="sess-dw"></div>' : '') +
      '<div class="sess-clock">' + (over ? 'TIME' : mmss(left)) + '</div>' +
      '<div class="sess-btns"></div>' +
    '</div>';

  host.querySelector('.sess-task').textContent = s.task;
  if (s.dw) host.querySelector('.sess-dw').textContent = 'Done when: ' + s.dw;

  var btns = host.querySelector('.sess-btns');
  function mk(label, solid, fn){
    var b = document.createElement('button');
    b.className = 'sess-btn' + (solid ? ' solid' : '');
    b.textContent = label; b.onclick = fn;
    btns.appendChild(b);
  }
  if (over){
    if (s.kind === 'break') mk('Back to work', true, function(){ endSession(); startPrompt(); });
    else mk('Check it', true, checkpoint);
    mk('+10 min', false, function(){
      var c = loadSession(); c.mins = c.mins + 10; saveSession(c); _rang = false; renderSession();
    });
  } else {
    mk(s.kind === 'break' ? 'End break' : 'Done early', true, s.kind === 'break' ? endSession : checkpoint);
    mk('Cancel', false, function(){ if (confirm('Cancel this session?')) endSession(); });
  }

  if (over && !_rang){
    _rang = true;
    ring();
  }
  document.title = over ? ('\u23F0 TIME \u2014 ' + _origTitle) : (mmss(left) + ' \u2014 ' + _origTitle);

  if (!_tick) _tick = setInterval(renderSession, 1000);
}

/* ---------- session log: estimate vs actual ----------------------------- */
var K_LOG = 'forge-sessions';

function logSession(sess, met){
  if (!sess || sess.kind === 'break') return;
  var actual = Math.round((Date.now() - (sess.firstStartedAt || sess.startedAt)) / 60000);
  var log = readJSON(K_LOG, []);
  if (Object.prototype.toString.call(log) !== '[object Array]') log = [];
  log.push({ d: ymd(new Date()), task: sess.task, est: sess.mins || 0, act: actual,
             blocks: sess.blocks || 1, met: !!met, key: !!sess.wasKeystone });
  if (log.length > 300) log = log.slice(log.length - 300);
  writeJSON(K_LOG, log);
}

function estimateStats(days){
  var log = readJSON(K_LOG, []);
  if (Object.prototype.toString.call(log) !== '[object Array]' || !log.length) return null;
  var c = new Date(); c.setDate(c.getDate() - (days || 30));
  var cut = ymd(c);
  var rows = log.filter(function(r){ return r.d >= cut && r.est > 0 && r.act > 0; });
  if (rows.length < 3) return { n: rows.length, ratio: null };
  var te = 0, ta = 0, over = 0, met = 0, keyRows = 0, keyMet = 0;
  rows.forEach(function(r){
    te += r.est; ta += r.act;
    if (r.act > r.est * 1.1) over++;
    if (r.met) met++;
    if (r.key){ keyRows++; if (r.met) keyMet++; }
  });
  return { n: rows.length, ratio: ta / te,
           overPct: Math.round(over / rows.length * 100),
           metPct: Math.round(met / rows.length * 100),
           keyN: keyRows, keyPct: keyRows ? Math.round(keyMet / keyRows * 100) : null };
}

function renderStats(){
  var host = document.getElementById('stats-host');
  if (!host) return;
  var st = estimateStats(30);
  if (!st){ host.innerHTML = ''; return; }
  if (st.ratio === null){
    host.innerHTML = '<div class="statline">Logging your sessions \u2014 ' + st.n +
      ' so far. Three are needed before a pattern shows.</div>';
    return;
  }
  var r = st.ratio.toFixed(2);
  var verdict = st.ratio > 1.35 ? 'Your estimates run short. Try padding them by about ' + Math.round((st.ratio - 1) * 100) + '%.'
              : st.ratio > 1.10 ? 'Slightly optimistic, but close.'
              : st.ratio < 0.85 ? 'You over-budget. You could plan more into a day.'
              : 'Your estimates are accurate. Trust them.';
  var key = st.keyN ? ('<br>Keystone sessions: <b>' + st.keyPct + '%</b> finished (' + st.keyN + ' logged).') : '';
  host.innerHTML = '<div class="statline"><b>Estimate vs actual</b> \u00B7 last 30 days, ' + st.n + ' sessions<br>' +
    'You take <b>' + r + '\u00D7</b> what you estimate. ' + st.overPct + '% ran over. ' +
    st.metPct + '% ended with the done-when met.' + key +
    '<br><span style="opacity:.75;">' + verdict + '</span></div>';
}

/* ---------- off-day tracker: a nudge, never a rule ---------------------- */
var K_OFF = 'forge-offdays';

function offDays(){
  var a = readJSON(K_OFF, []);
  return Object.prototype.toString.call(a) === '[object Array]' ? a : [];
}
function daysSinceOff(){
  var a = offDays();
  if (!a.length) return null;
  a.sort();
  var last = new Date(a[a.length - 1] + 'T00:00:00');
  return Math.round((new Date(ymd(new Date()) + 'T00:00:00') - last) / 86400000);
}
function markOffDay(){
  var a = offDays(), t = ymd(new Date());
  if (a.indexOf(t) === -1) a.push(t);
  if (a.length > 200) a = a.slice(a.length - 200);
  writeJSON(K_OFF, a);
  renderOffDay();
}
function renderOffDay(){
  var host = document.getElementById('off-host');
  if (!host) return;
  host.innerHTML = '';
  var n = daysSinceOff();
  var isOff = offDays().indexOf(ymd(new Date())) !== -1;
  var box = document.createElement('div');
  if (isOff){
    box.className = 'offline off-today';
    box.innerHTML = '\u2600\uFE0F <b>Today is an off day.</b> Goals are allowed \u2014 rest, a film, the girls. Nothing else is owed.';
    host.appendChild(box);
    return;
  }
  if (n === null){ box.className = 'offline'; box.innerHTML = 'No off day recorded yet.'; }
  else if (n >= 7){ box.className = 'offline off-due'; box.innerHTML = '\u26A0 <b>' + n + ' days</b> since your last off day. You are due one.'; }
  else { box.className = 'offline'; box.innerHTML = n + ' day' + (n === 1 ? '' : 's') + ' since an off day.'; }
  var b = document.createElement('button');
  b.className = 'li-btn'; b.style.marginTop = '7px';
  b.textContent = 'Mark today as an off day';
  b.onclick = markOffDay;
  box.appendChild(document.createElement('br'));
  box.appendChild(b);
  host.appendChild(box);
}

  "That's the block. Rest is part of the operation.",
  "Down tools. Nobody wins the second hour by skipping the break.",
  "Time. Go and look at something that isn't a screen."
];

var SOUNDS = [
  { id:'chime',  name:'Soft chime',   desc:'three descending notes' },
  { id:'bell',   name:'Single bell',  desc:'one note, long decay' },
  { id:'beep',   name:'Triple beep',  desc:'sharp and unmissable' },
  { id:'gong',   name:'Low gong',     desc:'deep, slow fade' },
  { id:'alert',  name:'Rising alert', desc:'two tones, urgent' },
  { id:'speak',  name:'The Colonel',  desc:'speaks a line out loud' },
  { id:'silent', name:'Silent',       desc:'red flash only' }
];

function soundChoice(){
  try { return localStorage.getItem(K_SOUND) || 'chime'; } catch(e){ return 'chime'; }
}
function setSoundChoice(v){ try { localStorage.setItem(K_SOUND, v); } catch(e){} }

try { if (window.speechSynthesis) window.speechSynthesis.onvoiceschanged = refreshVoices; } catch(e){}

function unlockAudio(){
  try {
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!_ac) _ac = new Ctx();
    if (_ac.state === 'suspended') _ac.resume();
    var o = _ac.createOscillator(), g = _ac.createGain();
    g.gain.value = 0.0001; o.connect(g); g.connect(_ac.destination);
    o.start(); o.stop(_ac.currentTime + 0.01);
  } catch(e){}
}

function tone(freq, startAt, dur, vol, type){
  if (!_ac) return;
  try {
    var o = _ac.createOscillator(), g = _ac.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    o.connect(g); g.connect(_ac.destination);
    var t = _ac.currentTime + startAt;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t); o.stop(t + dur + 0.05);
  } catch(e){}
}

var K_VOICE = 'forge-voice';
var _voices = [];

function refreshVoices(){
  try {
    if (!window.speechSynthesis) return;
    _voices = window.speechSynthesis.getVoices() || [];
  } catch(e){ _voices = []; }
}

/* English voices only, male-sounding ones first */
function usableVoices(){
  refreshVoices();
  var en = _voices.filter(function(v){ return /^en/i.test(v.lang || ''); });
  if (!en.length) en = _voices.slice();
  var MALE = /daniel|alex|arthur|fred|gordon|oliver|rishi|aaron|tom|james|george|male/i;
  var males = en.filter(function(v){ return MALE.test(v.name || ''); });
  var rest  = en.filter(function(v){ return !MALE.test(v.name || ''); });
  return males.concat(rest);
}

function chosenVoice(){
  var list = usableVoices();
  if (!list.length) return null;
  var want = null;
  try { want = localStorage.getItem(K_VOICE); } catch(e){}
  if (want){
    for (var i = 0; i < list.length; i++) if (list[i].name === want) return list[i];
  }
  return list[0];            /* best male match, or first English voice */
}

function cycleVoice(){
  var list = usableVoices();
  if (!list.length){ alert('No speech voices are available in this browser.'); return; }
  var cur = chosenVoice();
  var idx = 0;
  for (var i = 0; i < list.length; i++) if (cur && list[i].name === cur.name) idx = i;
  var next = list[(idx + 1) % list.length];
  try { localStorage.setItem(K_VOICE, next.name); } catch(e){}
  speakLine(next);
  var lbl = document.getElementById('voice-name');
  if (lbl) lbl.textContent = next.name;
}

function speakLine(forceVoice){
  try {
    if (!window.speechSynthesis) return false;
    var line = COLONEL_BREAK_LINES[Math.floor(Math.random() * COLONEL_BREAK_LINES.length)];
    var u = new SpeechSynthesisUtterance(line);
    var v = forceVoice || chosenVoice();
    if (v) u.voice = v;
    u.rate = 0.88; u.pitch = 0.6; u.volume = 1;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
    return true;
  } catch(e){ return false; }
}

function playSound(which){
  which = which || soundChoice();
  if (which === 'silent') return;
  if (which === 'speak'){ if (speakLine()) return; which = 'chime'; }
  if (!_ac) return;
  if (which === 'chime'){
    tone(784, 0, 0.55, 0.22); tone(659, 0.28, 0.55, 0.22); tone(523, 0.56, 0.95, 0.22);
  } else if (which === 'bell'){
    tone(880, 0, 1.9, 0.25); tone(1760, 0, 1.2, 0.06);
  } else if (which === 'beep'){
    tone(880, 0, 0.16, 0.28, 'square'); tone(880, 0.26, 0.16, 0.28, 'square'); tone(880, 0.52, 0.16, 0.28, 'square');
  } else if (which === 'gong'){
    tone(110, 0, 2.8, 0.30, 'triangle'); tone(165, 0, 2.2, 0.14, 'triangle'); tone(220, 0, 1.6, 0.08);
  } else if (which === 'alert'){
    tone(587, 0, 0.28, 0.26, 'sawtooth'); tone(880, 0.30, 0.45, 0.26, 'sawtooth');
  }
}

function ring(){
  playSound();
  try {
    if (window.Notification && Notification.permission === 'granted'){
      var s = loadSession();
      new Notification(s && s.kind === 'break' ? 'Break over' : 'Time is up',
                       { body: s && s.dw ? ('Done when: ' + s.dw) : 'Check your done-when.' });
    }
  } catch(e){}
}

function openSoundPicker(){
  unlockAudio();
  var host = document.getElementById('sound-host');
  if (!host) return;
  if (host.innerHTML){ host.innerHTML = ''; return; }
  var cur = soundChoice();
  var wrap = document.createElement('div');
  wrap.className = 'panel';
  var head = document.createElement('div');
  head.className = 'sound-head';
  head.textContent = 'Alarm sound \u2014 tap Hear to try one';
  wrap.appendChild(head);
  SOUNDS.forEach(function(sd){
    var row = document.createElement('div');
    row.className = 'li';
    var t = document.createElement('div');
    t.className = 'li-txt';
    t.innerHTML = (sd.id === cur ? '\u2713 ' : '') + sd.name +
                  ' <span style="font-weight:600;opacity:.6;">\u00B7 ' + sd.desc + '</span>';
    var hear = document.createElement('button');
    hear.className = 'li-btn'; hear.textContent = 'Hear';
    hear.onclick = function(){ unlockAudio(); playSound(sd.id); };
    var pick = document.createElement('button');
    pick.className = 'li-btn go'; pick.textContent = 'Use';
    pick.onclick = function(){ setSoundChoice(sd.id); host.innerHTML = ''; openSoundPicker(); };
    row.appendChild(t); row.appendChild(hear); row.appendChild(pick);
    wrap.appendChild(row);
  });
  var vrow = document.createElement('div');
  vrow.className = 'li';
  var vt = document.createElement('div');
  vt.className = 'li-txt';
  var cv = chosenVoice();
  vt.innerHTML = 'Speaking voice: <span id="voice-name" style="font-weight:800;">' +
                 (cv ? cv.name : 'none available') + '</span>';
  var vb = document.createElement('button');
  vb.className = 'li-btn go'; vb.textContent = 'Next voice';
  vb.onclick = cycleVoice;
  vrow.appendChild(vt); vrow.appendChild(vb);
  wrap.appendChild(vrow);

  var note = document.createElement('div');
  note.className = 'empty';
  note.textContent = 'Sound plays only while this tab is open. For alarms behind other apps, set your phone Clock timer as well.';
  wrap.appendChild(note);
  host.appendChild(wrap);
}

function askNotify(){
  try {
    if (window.Notification && Notification.permission === 'default') Notification.requestPermission();
  } catch(e){}
}

/* ---------- misc ---------- */
function flashSaved(ok){
  var el = document.getElementById('saved');
  if (ok === false){
    el.style.color = '#8a1010';
    el.textContent = '\u26A0 NOT SAVED \u2014 storage is blocked in this browser';
    return;
  }
  el.style.color = '';
  el.textContent = '\u2713 saved';
  clearTimeout(window._sv);
  window._sv = setTimeout(function(){ el.textContent = ''; }, 1200);
}
function trainingBanner(){
  var type = TRAINING[viewDate().getDay()];
  document.getElementById('banner').textContent =
    type === 'Rest' ? '\uD83D\uDECC Rest day'
    : (type === 'Lift' ? '\uD83C\uDFCB\uFE0F Lift day (whenever suits you)'
                       : '\uD83D\uDD25 HIIT day (whenever suits you)');
}
function setDay(off){
  dayOffset = off;
  document.getElementById('tab-today').className = 'daytab' + (off === 0 ? ' active' : '');
  document.getElementById('tab-tom').className = 'daytab' + (off === 1 ? ' active' : '');
  renderAll();
  fetchCalendar();
}
function clearDay(){
  var label = isToday() ? "today's" : "tomorrow's";
  if (!confirm('Clear ' + label + ' hour grid AND Top 5?\n\nThis cannot be undone from here (a backup is kept).')) return;
  if (!confirm('Really clear ' + label + ' plan?')) return;
  var all = readJSON(K_PLAN, {}); delete all[dayKey()]; writeJSON(K_PLAN, all);
  var t5 = readJSON(K_TOP5, {}); delete t5[dayKey()]; writeJSON(K_TOP5, t5);
  afterSave(); renderAll();
}
function toggleIO(){
  var io = document.getElementById('io'), b = document.getElementById('iobtns');
  if (io.style.display === 'block'){ io.style.display = 'none'; b.style.display = 'none'; return; }
  io.value = JSON.stringify(snapshot());
  io.style.display = 'block'; b.style.display = 'flex';
}
function copyIO(){
  var io = document.getElementById('io');
  io.select(); io.setSelectionRange(0, 999999);
  try { document.execCommand('copy'); alert('Copied. Paste it somewhere safe.'); }
  catch(e){ alert('Select the text and copy manually.'); }
}
function importIO(){
  var io = document.getElementById('io');
  var b;
  try { b = JSON.parse(io.value); } catch(e){ alert('That is not valid backup text.'); return; }
  if (!confirm('Replace everything with this backup?')) return;
  writeJSON(K_PLAN, b.plan || {});
  writeJSON(K_TOP5, b.top5 || {});
  writeJSON(K_BACKLOG, b.backlog || []);
  writeJSON(K_FUN, b.fun || []);
  renderAll(); alert('Restored.');
}
function paintDate(){
  document.getElementById('date').textContent =
    viewDate().toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric'});
}
function renderLists(){
  renderList(K_BACKLOG, 'backlog', 'add to backlog…', true);
  renderList(K_FUN, 'fun', 'add a family idea…', true);
}
function renderAll(){
  paintDate(); trainingBanner(); paintMeta();
  renderSession();
  renderTop5(); paintNext();
  renderLists();
  renderGrid(); checkEmptyWarning();
  renderOffDay(); renderStats();
}

window.onload = function(){
  renderAll();
  syncPull(function(){ renderAll(); });
  askNotify();
  fetchCalendar();
  fetchReminders();
  setInterval(function(){ paintNext(); }, 60000);
};
</script>
