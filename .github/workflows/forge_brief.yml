name: Generate FORGE OS Daily Brief
on:
  schedule:
    # 14:00 UTC — early morning Pacific (6 AM PST / 7 AM PDT). Home schedule.
    - cron: '0 14 * * *'
    # 21:00 UTC — 6 AM JST the next day, so the brief is fresh before a Japan
    # morning. Harmless when home: it just rebuilds the same day in the afternoon.
    - cron: '0 21 * * *'
  push:
    branches:
      - gh-pages
    paths:
      - data.json
  # Allow manual trigger from the GitHub website
  workflow_dispatch:
concurrency:
  group: pages-deploy
  cancel-in-progress: false
jobs:
  generate-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v3
        with:
          ref: gh-pages
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pwd
          ls -la
          pip install caldav vobject
      - name: Generate brief
        env:
          ICLOUD_EMAIL: ${{ secrets.ICLOUD_EMAIL }}
          ICLOUD_PASSWORD: ${{ secrets.ICLOUD_PASSWORD }}
          JSONBIN_MASTER_KEY: ${{ secrets.JSONBIN_MASTER_KEY }}
          # install12 travel override. These are repository VARIABLES, not secrets.
          # Unset or deleted, forge_actions.py falls back to Richmond / Pacific.
          FORGE_TZ: ${{ vars.FORGE_TZ }}
          FORGE_LAT: ${{ vars.FORGE_LAT }}
          FORGE_LON: ${{ vars.FORGE_LON }}
        run: |
          pwd
          ls -la
          python forge_actions.py
      - name: Commit and push index.html
        run: |
          pwd
          ls -la
          git config user.name "FORGE OS Bot"
          git config user.email "forge@theseanman.github.io"
          ls -la calendar.json || echo "MISSING"
          git add -f index.html data.json
          git diff --staged --quiet && echo "Nothing to commit" && exit 0
          git commit -m "FORGE Brief $(date +'%b %d %Y')"
          # Rebase-then-push with retry: closes the race where an external push
          # (e.g. a data.json sync) lands on gh-pages between our checkout and
          # our push, which caused non-fast-forward rejections.
          for i in 1 2 3 4 5; do
            if git pull --rebase origin gh-pages && git push origin gh-pages; then
              echo "Push succeeded on attempt $i"
              exit 0
            fi
            echo "Push attempt $i failed — refetching and retrying"
            sleep 5
          done
          echo "Push failed after 5 attempts"
          exit 1
