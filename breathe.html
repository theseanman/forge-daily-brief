<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Breathing Room</title>
<style>
  :root{
    --sky-hi:#1565d8; --sky-lo:#9fd4ff;
    --sea-deep:#0a4d8c; --sea-mid:#1878c8; --sea-shal:#3ec3d4;
    --foam:#eafcff; --sand-dry:#e8cf9f; --sand-wet:#c8a06d;
    --ink:#0b2547; --panel:rgba(6,28,64,0.82); --chip:#e9f4ff;
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--sky-hi); }
  #scene{ position:fixed; inset:0; width:100%; height:100%; }
  /* HUD during a session */
  #hud{ position:fixed; inset:0; display:none; pointer-events:none; }
  #hud.on{ display:block; }
  .phase-wrap{ position:absolute; top:9%; left:0; right:0; text-align:center; color:#fff; text-shadow:0 2px 14px rgba(6,30,70,.55); }
  #phase{ font-size:13px; letter-spacing:.32em; text-transform:uppercase; font-weight:700; opacity:.95; }
  #count{ font-size:clamp(72px,18vw,132px); font-weight:200; line-height:1.05; letter-spacing:-.02em; }
  #meta{ font-size:12px; letter-spacing:.14em; text-transform:uppercase; opacity:.85; font-weight:600; margin-top:4px; }
  .bar{ position:absolute; bottom:calc(14px + env(safe-area-inset-bottom)); left:0; right:0; display:flex; justify-content:center; gap:12px; pointer-events:auto; }
  .bbtn{ border:0; border-radius:999px; padding:12px 22px; font-size:14px; font-weight:700; letter-spacing:.06em; cursor:pointer; background:rgba(255,255,255,.92); color:var(--ink); box-shadow:0 4px 18px rgba(6,30,70,.35); }
  .bbtn.ghost{ background:rgba(9,36,80,.55); color:#fff; }
  /* Menu */
  #menu{ position:fixed; inset:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:26px 16px calc(30px + env(safe-area-inset-bottom)); }
  .m-head{ text-align:center; color:#fff; text-shadow:0 2px 12px rgba(6,30,70,.5); margin-bottom:16px; }
  .m-head h1{ font-size:15px; letter-spacing:.34em; text-transform:uppercase; font-weight:800; }
  .m-head p{ font-size:12px; letter-spacing:.1em; opacity:.9; margin-top:5px; }
  .pcard{ max-width:520px; margin:0 auto 12px; background:var(--panel); backdrop-filter:blur(6px); border:1px solid rgba(180,220,255,.35); border-radius:16px; padding:14px 16px; color:#eaf4ff; }
  .pcard h2{ font-size:15px; font-weight:800; letter-spacing:.02em; color:#fff; }
  .pcard .use{ font-size:12.5px; line-height:1.5; opacity:.88; margin-top:3px; }
  .pcard .safety{ font-size:11px; line-height:1.55; opacity:.75; margin-top:7px; }
  .chips{ display:flex; flex-wrap:wrap; gap:7px; margin-top:10px; }
  .chip{ border:1px solid rgba(190,225,255,.5); background:transparent; color:#eaf4ff; border-radius:999px; padding:7px 13px; font-size:13px; font-weight:700; cursor:pointer; }
  .chip.on{ background:var(--chip); color:var(--ink); border-color:var(--chip); }
  .go{ margin-top:11px; width:100%; border:0; border-radius:12px; padding:12px; font-size:15px; font-weight:800; letter-spacing:.08em; cursor:pointer; color:var(--ink); background:linear-gradient(135deg,#bfe7ff,#7fd4e6); }
  .m-foot{ max-width:520px; margin:8px auto 0; display:flex; justify-content:center; }
  #done{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; color:#fff; text-shadow:0 2px 14px rgba(6,30,70,.55); }
  #done.on{ display:flex; }
  #done .big{ font-size:30px; font-weight:200; letter-spacing:.06em; }
  #done .sub{ font-size:12px; letter-spacing:.22em; text-transform:uppercase; margin-top:10px; opacity:.9; font-weight:700; }
  /* palm sway via SMIL animateTransform (embedded in <svg>) — CSS handles reduced-motion only */
  body.reduced-motion .sway-anim{ display:none; }

  #done .rate{ display:none; margin-top:16px; }
  #done.co2 .rate{ display:flex; }
  #done .rate{ gap:8px; justify-content:center; flex-wrap:wrap; }
  #done .rate .lbl{ width:100%; text-align:center; font-size:11px; letter-spacing:.22em; text-transform:uppercase; opacity:.7; font-weight:700; margin-bottom:4px; }
  #done .rate button{ border:1px solid rgba(255,255,255,.5); background:rgba(9,36,80,.35); color:#fff; border-radius:999px; padding:9px 16px; font-size:13px; font-weight:700; letter-spacing:.06em; cursor:pointer; }
  #done .rate button.on{ background:#4a9de8; border-color:#4a9de8; color:#0b2547; }
  #done .rate .skip{ display:block; width:100%; text-align:center; font-size:11px; letter-spacing:.16em; text-transform:uppercase; opacity:.6; margin-top:6px; }
  @media (prefers-reduced-motion: reduce){ .rm-hide{ display:none; } }
</style>
</head>

<script>
/* ================= pattern engine (pure) ================= */
var CO2_LEVELS = {
  L1:{inh:4, out:8,  hold:0},
  L2:{inh:4, out:10, hold:0},
  L3:{inh:4, out:8,  hold:4},
  L4:{inh:4, out:10, hold:6},
  L5:{inh:4, out:12, hold:8}
};
/* phase: {k:'in'|'in2'|'out'|'ht'|'hb', d:seconds, label, target:0..1} */
function buildSession(pid, opt){
  opt = opt || {};
  var pre = [], cycle = [], cycles = null, maxSec = null;
  if (pid === 'coherent'){
    var p = opt.pace || 5.5;
    cycle = [ {k:'in', d:p, label:'Inhale', target:1},
              {k:'out', d:p, label:'Exhale', target:0.08} ];
    if (opt.dur) maxSec = opt.dur;
  } else if (pid === 'reset'){
    pre =   [ {k:'out', d:6, label:'Empty the lungs', target:0.08} ];
    cycle = [ {k:'in', d:4, label:'Inhale', target:1},
              {k:'ht', d:2, label:'Hold', target:1},
              {k:'out', d:6, label:'Exhale', target:0.08} ];
  } else if (pid === 'sigh'){
    cycle = [ {k:'in', d:1.6, label:'Inhale', target:0.82},
              {k:'in2', d:1.0, label:'Top up', target:1},
              {k:'out', d:6, label:'Long exhale', target:0.08} ];
    if (opt.mode === 'five') maxSec = 300;
    else if (opt.mode === 'x5') cycles = 5;
    /* 'open' runs until Stop */
  } else if (pid === 'box'){
    cycle = [ {k:'in', d:4, label:'Inhale', target:1},
              {k:'ht', d:4, label:'Hold', target:1},
              {k:'out', d:4, label:'Exhale', target:0.08},
              {k:'hb', d:4, label:'Hold', target:0.08} ];
  } else if (pid === 'endday'){
    cycle = [ {k:'in', d:4, label:'Inhale', target:1},
              {k:'out', d:6, label:'Exhale', target:0.08} ];
  } else if (pid === 'co2'){
    var lv = CO2_LEVELS[opt.level || 'L1'];
    cycle = [ {k:'in', d:lv.inh, label:'Inhale', target:1},
              {k:'out', d:lv.out, label:'Exhale', target:0.08} ];
    if (lv.hold > 0) cycle.push({k:'hb', d:lv.hold, label:'Hold empty', target:0.08});
  }
  return { pre:pre, cycle:cycle, cycles:cycles, maxSec:maxSec };
}
function phaseAt(sess, idx){
  if (idx < sess.pre.length) return sess.pre[idx];
  var ci = (idx - sess.pre.length) % sess.cycle.length;
  return sess.cycle[ci];
}
function cyclesDone(sess, idx){
  if (idx < sess.pre.length) return 0;
  return Math.floor((idx - sess.pre.length) / sess.cycle.length);
}
function sessionOver(sess, idx, elapsedSec){
  if (sess.cycles !== null && cyclesDone(sess, idx) >= sess.cycles) return true;
  if (sess.maxSec !== null && elapsedSec >= sess.maxSec &&
      (idx >= sess.pre.length) && ((idx - sess.pre.length) % sess.cycle.length === 0)) return true;
  return false;
}
function easeIO(p){ return 0.5 - 0.5 * Math.cos(Math.PI * Math.max(0, Math.min(1, p))); }

/* ================= scene ================= */
var HORIZON = 300, EDGE_OUT = 462, EDGE_IN = 622;
var seaEl, foamEl, foam2El;
var level = 0.35, ripT = 0;
var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function edgeY(){ return EDGE_OUT + (EDGE_IN - EDGE_OUT) * level; }
function seaPath(t){
  var e = edgeY(), amp = REDUCED ? 1.5 : 7, amp2 = REDUCED ? 0 : 3;
  var d = 'M0,' + HORIZON + ' L1000,' + HORIZON + ' L1000,' + (e + 20).toFixed(1);
  var x;
  for (x = 1000; x >= 0; x -= 40){
    var y = e + Math.sin(x * 0.011 + t * 1.3) * amp + Math.sin(x * 0.027 - t * 0.8) * amp2;
    d += ' L' + x + ',' + y.toFixed(1);
  }
  d += ' L0,' + (e + 20).toFixed(1) + ' Z';
  return d;
}
function foamPath(t, off){
  var e = edgeY() - (off || 0), amp = REDUCED ? 1.5 : 7, amp2 = REDUCED ? 0 : 3;
  var d = '', x;
  for (x = 0; x <= 1000; x += 40){
    var y = e + Math.sin(x * 0.011 + t * 1.3) * amp + Math.sin(x * 0.027 - t * 0.8) * amp2;
    d += (x === 0 ? 'M' : ' L') + x + ',' + y.toFixed(1);
  }
  return d;
}
function paintScene(){
  seaEl.setAttribute('d', seaPath(ripT));
  foamEl.setAttribute('d', foamPath(ripT, 0));
  if (foam2El) foam2El.setAttribute('d', foamPath(ripT * 0.8, 14));
}

/* ================= audio (synthesized ocean) ================= */
var AC = null, master = null, bedGain = null, swell = null, swellF = null, swellG = null, cue = null, cueG = null;
var soundOn = true;
var fileMode = false, chimeEl = null;
var AUDIO_SRC = { 55:'coherent-55.m4a', 60:'coherent-60.m4a', 65:'coherent-65.m4a', sigh:'sigh.m4a' };
function noiseBuffer(ac){
  var len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate);
  var d = buf.getChannelData(0), i;
  for (i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  return buf;
}
function audioInit(){
  if (AC) return;
  try{
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = soundOn ? 1 : 0; master.connect(AC.destination);
    var buf = noiseBuffer(AC);
    var bed = AC.createBufferSource(); bed.buffer = buf; bed.loop = true;
    var bedF = AC.createBiquadFilter(); bedF.type = 'lowpass'; bedF.frequency.value = 480;
    bedGain = AC.createGain(); bedGain.gain.value = 0.05;
    bed.connect(bedF); bedF.connect(bedGain); bedGain.connect(master); bed.start();
    swell = AC.createBufferSource(); swell.buffer = buf; swell.loop = true;
    swellF = AC.createBiquadFilter(); swellF.type = 'lowpass'; swellF.frequency.value = 300;
    swellG = AC.createGain(); swellG.gain.value = 0.0;
    swell.connect(swellF); swellF.connect(swellG); swellG.connect(master); swell.start();
    cue = AC.createOscillator(); cue.type = 'sine'; cue.frequency.value = 200;
    cueG = AC.createGain(); cueG.gain.value = 0.0;
    cue.connect(cueG); cueG.connect(master); cue.start();
  }catch(e){ AC = null; }
}
function audioPhase(ph){
  if (!AC) return;
  try{ if (AC.state === 'suspended') AC.resume(); }catch(e){}
  var t0 = AC.currentTime, t1 = t0 + ph.d;
  swellG.gain.cancelScheduledValues(t0); swellF.frequency.cancelScheduledValues(t0);
  cueG.gain.cancelScheduledValues(t0); cue.frequency.cancelScheduledValues(t0);
  if (ph.k === 'in' || ph.k === 'in2'){
    swellG.gain.setValueAtTime(Math.max(0.03, swellG.gain.value), t0);
    swellG.gain.linearRampToValueAtTime(0.22, t1);
    swellF.frequency.setValueAtTime(Math.max(300, swellF.frequency.value), t0);
    swellF.frequency.linearRampToValueAtTime(ph.k === 'in2' ? 2600 : 2100, t1);
    cueG.gain.setValueAtTime(0.0, t0); cueG.gain.linearRampToValueAtTime(0.028, t0 + 0.25);
    cueG.gain.linearRampToValueAtTime(0.02, t1);
    cue.frequency.setValueAtTime(210, t0); cue.frequency.linearRampToValueAtTime(340, t1);
  } else if (ph.k === 'out'){
    swellG.gain.setValueAtTime(Math.max(0.05, swellG.gain.value), t0);
    swellG.gain.linearRampToValueAtTime(0.02, t1);
    swellF.frequency.setValueAtTime(Math.max(600, swellF.frequency.value), t0);
    swellF.frequency.linearRampToValueAtTime(240, t1);
    cueG.gain.setValueAtTime(0.028, t0); cueG.gain.linearRampToValueAtTime(0.0, t1);
    cue.frequency.setValueAtTime(320, t0); cue.frequency.linearRampToValueAtTime(150, t1);
  } else { /* holds: quiet bed */
    swellG.gain.setValueAtTime(swellG.gain.value, t0);
    swellG.gain.linearRampToValueAtTime(0.03, t0 + 0.5);
    cueG.gain.setValueAtTime(cueG.gain.value, t0);
    cueG.gain.linearRampToValueAtTime(0.0, t0 + 0.3);
  }
}
function audioStopAll(){
  if (!AC) return;
  var t0 = AC.currentTime;
  try{
    swellG.gain.cancelScheduledValues(t0); swellG.gain.linearRampToValueAtTime(0.0, t0 + 0.6);
    cueG.gain.cancelScheduledValues(t0); cueG.gain.linearRampToValueAtTime(0.0, t0 + 0.3);
  }catch(e){}
}
function setSound(on){
  soundOn = on;
  if (master) master.gain.value = on ? 1 : 0;
  if (chimeEl) chimeEl.muted = !on;
  var b = document.getElementById('sndBtn');
  if (b) b.textContent = on ? 'Sound on' : 'Sound off';
  uiSave();
}


/* ---------- background chime playback (audio file, survives lock/app-switch) ---------- */
function stopChime(){
  fileMode = false;
  if (chimeEl){ try{ chimeEl.pause(); chimeEl.currentTime = 0; }catch(e){} }
  try{ if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'none'; }catch(e){}
}
function setupMediaSession(title){
  if (!('mediaSession' in navigator)) return;
  try{
    navigator.mediaSession.metadata = new MediaMetadata({ title:title, artist:'The Breathing Room', album:'Forge' });
    navigator.mediaSession.playbackState = 'playing';
    navigator.mediaSession.setActionHandler('play',  function(){ try{ chimeEl.play(); }catch(e){} try{ navigator.mediaSession.playbackState='playing'; }catch(e){} });
    navigator.mediaSession.setActionHandler('pause', function(){ try{ chimeEl.pause(); }catch(e){} try{ navigator.mediaSession.playbackState='paused'; }catch(e){} });
    navigator.mediaSession.setActionHandler('stop',  function(){ endSession(false); });
  }catch(e){}
}
function startChimeSession(pid, opt, key, title){
  chimeEl = document.getElementById('chime');
  fileMode = true;
  if (chimeEl){
    try{
      chimeEl.src = AUDIO_SRC[key];
      chimeEl.loop = true;
      chimeEl.muted = !soundOn;
      var p = chimeEl.play();
      if (p && p.catch) p.catch(function(){});
    }catch(e){}
  }
  setupMediaSession(title);
  startSession(pid, opt);
}

/* ---------- session log: forge-breathe-log (synced, union by ts) ---------- */
var SYNC_URL='https://forge-sync.yoseanreid.workers.dev';
var BLOG_KEY='forge-breathe-log', BLOG_MIN_SEC=20, BLOG_MAX_DAYS=120, BLOG_MAX_PER_DAY=40;
function blogYmd(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function blogRead(){ try{ var v=JSON.parse(localStorage.getItem(BLOG_KEY)||'{}'); return (v&&typeof v==='object'&&!Array.isArray(v))?v:{}; }catch(e){ return {}; } }
function blogWrite(all){ try{ localStorage.setItem(BLOG_KEY, JSON.stringify(all)); }catch(e){} }
function blogUnionDay(a,b){
  var seen={}, out=[];
  (a||[]).concat(b||[]).forEach(function(s){
    if(!s||typeof s!=='object') return;
    var id=String(s.id||s.ts||''); if(!id||seen[id]) return; seen[id]=1; out.push(s);
  });
  out.sort(function(x,y){ return (x.ts||0)-(y.ts||0); });
  if(out.length>BLOG_MAX_PER_DAY) out=out.slice(-BLOG_MAX_PER_DAY);
  return out;
}
function blogAppend(all, dk, sess){
  if(!all||typeof all!=='object'||Array.isArray(all)) all={};
  var day=(all[dk]&&Array.isArray(all[dk].s))?all[dk].s:[];
  all[dk]={ s: blogUnionDay(day,[sess]) };
  var keys=Object.keys(all).sort();
  if(keys.length>BLOG_MAX_DAYS){ var o={}; keys.slice(-BLOG_MAX_DAYS).forEach(function(k){o[k]=all[k];}); if(!o[dk]) o[dk]=all[dk]; all=o; }
  return all;
}
function blogTodaySec(all, dk){
  var day=(all[dk]&&Array.isArray(all[dk].s))?all[dk].s:[], t=0;
  day.forEach(function(s){ t += (typeof s.sec==='number'&&s.sec>0)?s.sec:0; });
  return t;
}
function blogPush(all){
  try{ fetch(SYNC_URL + '/' + encodeURIComponent(BLOG_KEY), { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(all) }).catch(function(){}); }catch(e){}
}
function blogPull(){
  fetch(SYNC_URL + '/' + encodeURIComponent(BLOG_KEY))
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(cloud){
      if(!cloud||typeof cloud!=='object'||Array.isArray(cloud)||cloud.error) return;
      var all=blogRead(), changed=false;
      for(var dk in cloud){
        if(!cloud.hasOwnProperty(dk)) continue;
        var cc=cloud[dk]; if(!cc||typeof cc!=='object') continue;
        var cs=Array.isArray(cc.s)?cc.s:[];
        var ls=(all[dk]&&Array.isArray(all[dk].s))?all[dk].s:[];
        var u=blogUnionDay(ls,cs);
        if(u.length!==ls.length){ all[dk]={s:u}; changed=true; }
      }
      if(changed) blogWrite(all);
    }).catch(function(){});
}
function blogRecord(pid, optLabel, sec){
  if(sec < BLOG_MIN_SEC) return -1;
  var d=new Date();
  var sess={ ts: Date.now(),
             id: String(Date.now())+'-'+Math.floor(Math.random()*1000000),
             hm: ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2),
             p: pid, o: optLabel, sec: Math.round(sec) };
  var all=blogRead();
  var dk=blogYmd();
  all=blogAppend(all, dk, sess);
  blogWrite(all); blogPush(all);
  return blogTodaySec(all, dk);
}

/* ---------- CO2 rating on Done: patches the LAST logged session ---------- */
function co2RateInit(pid){
  var done = document.getElementById('done');
  if (!done) return;
  done.classList.remove('co2');
  if (pid !== 'co2') return;
  done.classList.add('co2');
  var host = document.getElementById('co2-rate'); if (!host) return;
  var btns = host.querySelectorAll('button'); var i;
  for (i = 0; i < btns.length; i++) btns[i].classList.remove('on');
  for (i = 0; i < btns.length; i++){
    (function(b){
      b.onclick = function(ev){
        ev.stopPropagation();
        for (var j = 0; j < btns.length; j++) btns[j].classList.remove('on');
        b.classList.add('on');
        co2RateWrite(b.getAttribute('data-r'));
      };
    })(btns[i]);
  }
}
function co2RateWrite(feel){
  try{
    var all = blogRead(); var dk = blogYmd(); var day = (all[dk] && Array.isArray(all[dk].s)) ? all[dk].s : [];
    if (!day.length) return;
    var last = day[day.length - 1];
    if (last.p !== 'co2') return;
    last.feel = feel;
    all[dk] = { s: day };
    blogWrite(all); blogPush(all);
  }catch(e){}
}


/* ================= session runtime ================= */
var running = false, sess = null, idx = 0, phStart = 0, phFrom = 0.35, startAt = 0, raf = 0;
var curPid = '', curOpt = '';
function fmtCount(x){ var n = Math.ceil(x); return n < 0 ? 0 : n; }
function setText(id, s){ var el = document.getElementById(id); if (el) el.textContent = s; }
function startSession(pid, opt){
  curPid = pid;
  curOpt = (pid==='coherent') ? String((opt&&opt.pace)||'')+'s'
         : (pid==='sigh') ? String((opt&&opt.mode)||'')
         : (pid==='co2') ? String((opt&&opt.level)||'') : '';
  sess = buildSession(pid, opt);
  idx = 0; startAt = performance.now(); phStart = startAt; phFrom = level;
  running = true;
  document.getElementById('menu').style.display = 'none';
  document.getElementById('done').className = '';
  document.getElementById('hud').className = 'on';
  if (!fileMode){
    audioInit();
    if (AC && AC.state === 'suspended'){ try{ AC.resume(); }catch(e){} }
    audioPhase(phaseAt(sess, idx));
  }
  uiSave(pid);
  loop();
}
function endSession(toDone){
  running = false;
  if (raf) cancelAnimationFrame(raf);
  audioStopAll();
  stopChime();
  var todaySec = -1;
  if (startAt > 0){
    var elapsed = (performance.now() - startAt) / 1000;
    startAt = 0;
    try{ todaySec = blogRecord(curPid, curOpt, elapsed); }catch(e){}
  }
  document.getElementById('hud').className = '';
  var tt = document.getElementById('done-total');
  if (tt) tt.textContent = (todaySec > 0) ? ('TODAY: ' + Math.round(todaySec/60) + ' MIN') : '';
  try{ co2RateInit(curPid); }catch(e){}
  if (toDone){ document.getElementById('done').classList.add('on'); }
  else { document.getElementById('menu').style.display = 'block'; }
}
function loop(){
  if (!running) return;
  var now = performance.now();
  var ph = phaseAt(sess, idx);
  var t = (now - phStart) / 1000;
  if (t >= ph.d){
    phFrom = ph.target;
    idx++;
    var elapsed = (now - startAt) / 1000;
    if (sessionOver(sess, idx, elapsed)){ level = ph.target; paintScene(); endSession(true); return; }
    ph = phaseAt(sess, idx);
    phStart = now; t = 0;
    if (!fileMode) audioPhase(ph);
  }
  level = phFrom + (ph.target - phFrom) * easeIO(t / ph.d);
  ripT += REDUCED ? 0.004 : 0.016;
  paintScene();
  setText('phase', ph.label.toUpperCase());
  setText('count', String(fmtCount(ph.d - t)));
  var el = Math.floor((now - startAt) / 1000);
  setText('meta', 'CYCLE ' + (cyclesDone(sess, idx) + 1) + ' \u00b7 ' + Math.floor(el / 60) + ':' + ('0' + (el % 60)).slice(-2));
  raf = requestAnimationFrame(loop);
}

/* ================= menu ================= */
var UIK = 'forge-breathe-ui';
var uiState = { snd:true, pace:5.5, dur:600, sigh:'open', co2:'L1', apace:60, last:'' };
function uiLoad(){
  try{
    var v = JSON.parse(localStorage.getItem(UIK) || '{}');
    if (v && typeof v === 'object'){
      if (typeof v.snd === 'boolean') uiState.snd = v.snd;
      if (v.pace) uiState.pace = v.pace;
      if (v.dur !== undefined) uiState.dur = v.dur;
      if (v.sigh === 'x5' || v.sigh === 'five' || v.sigh === 'open') uiState.sigh = v.sigh;
      if (v.co2) uiState.co2 = v.co2;
      if (v.apace===55||v.apace===60||v.apace===65) uiState.apace = v.apace;
    }
  }catch(e){}
  soundOn = uiState.snd;
}
function uiSave(last){
  if (last) uiState.last = last;
  uiState.snd = soundOn;
  try{ localStorage.setItem(UIK, JSON.stringify(uiState)); }catch(e){}
}
function chipRow(opts, cur, cb){
  var w = document.createElement('div'); w.className = 'chips';
  opts.forEach(function(o){
    var b = document.createElement('button'); b.type = 'button';
    b.className = 'chip' + (o.v === cur ? ' on' : '');
    b.textContent = o.t;
    b.onclick = function(){
      cb(o.v);
      Array.prototype.forEach.call(w.children, function(c){ c.className = 'chip'; });
      b.className = 'chip on';
    };
    w.appendChild(b);
  });
  return w;
}
function card(title, use, build){
  var c = document.createElement('div'); c.className = 'pcard';
  var h = document.createElement('h2'); h.textContent = title; c.appendChild(h);
  var u = document.createElement('div'); u.className = 'use'; u.textContent = use; c.appendChild(u);
  build(c);
  return c;
}
function goBtn(c, label, fn){
  var g = document.createElement('button'); g.type = 'button'; g.className = 'go';
  g.textContent = label; g.onclick = fn; c.appendChild(g);
}
function buildMenu(){
  var m = document.getElementById('menu');
  m.innerHTML = '';
  var head = document.createElement('div'); head.className = 'm-head';
  head.innerHTML = '<h1>The Breathing Room</h1><p>Pick the breath for the moment. Nothing passes or fails.</p>';
  m.appendChild(head);

  m.appendChild(card('Coherent', 'Daily baseline \u2014 10 min raises HRV. Best at Zone 2 cool-down or in the evening.', function(c){
    c.appendChild(chipRow([{t:'5s', v:5},{t:'5.5s', v:5.5},{t:'6s', v:6},{t:'6.5s', v:6.5}], uiState.pace, function(v){ uiState.pace = v; uiSave(); }));
    c.appendChild(chipRow([{t:'5 min', v:300},{t:'10 min', v:600},{t:'Open', v:null}], uiState.dur, function(v){ uiState.dur = v; uiSave(); }));
    goBtn(c, 'Start coherent', function(){ startSession('coherent', {pace:uiState.pace, dur:uiState.dur}); });
  }));

  m.appendChild(card('Reset 4\u20112\u20116', 'The spike hits \u2014 a confrontation, a hard moment. Exhale first, then in 4 \u00b7 hold 2 \u00b7 out 6.', function(c){
    goBtn(c, 'Start reset', function(){ startSession('reset', {}); });
  }));

  m.appendChild(card('Physiological sigh', 'Double inhale through the nose, long exhale. 5 min each morning \u00b7 \u00d75 for a quick reset \u00b7 open as long as you need.', function(c){
    c.appendChild(chipRow([{t:'\u00d75 quick', v:'x5'},{t:'5 min morning', v:'five'},{t:'Open', v:'open'}], uiState.sigh, function(v){ uiState.sigh = v; uiSave(); }));
    goBtn(c, 'Start sighs', function(){ startSession('sigh', {mode:uiState.sigh}); });
  }));

  m.appendChild(card('Box 4\u20114\u20114\u20114', 'Steady before performance \u2014 equal sides with holds. Doubles as gentle CO\u2082 work.', function(c){
    goBtn(c, 'Start box', function(){ startSession('box', {}); });
  }));

  m.appendChild(card('End of Day \u2014 Extended Exhale', 'Evening downshift. In 4, out 6. Let the day recede with the water.', function(c){
    goBtn(c, 'Start wind-down', function(){ startSession('endday', {}); });
  }));

  m.appendChild(card('CO\u2082 Ladder', 'Air-hunger tolerance, gently. Advance a level only when the current one stays relaxed; drop back if you strain.', function(c){
    c.appendChild(chipRow([{t:'L1 4\u00b78', v:'L1'},{t:'L2 4\u00b710', v:'L2'},{t:'L3 4\u00b78\u00b7h4', v:'L3'},{t:'L4 4\u00b710\u00b7h6', v:'L4'},{t:'L5 4\u00b712\u00b7h8', v:'L5'}], uiState.co2, function(v){ uiState.co2 = v; uiSave(); }));
    var s = document.createElement('div'); s.className = 'safety';
    s.textContent = 'Nasal \u00b7 seated \u00b7 mild air hunger only \u00b7 never in water or while driving \u00b7 stop if dizzy.';
    c.appendChild(s);
    goBtn(c, 'Start ladder', function(){ startSession('co2', {level:uiState.co2}); });
  }));

  m.appendChild(card('Coherent \u00b7 Audio (background)', 'Chime-paced coherent breathing that plays on your lock screen \u2014 keeps pacing you when you switch apps or lock the phone. Loops until you stop it.', function(c){
    c.appendChild(chipRow([{t:'5.5s', v:55},{t:'6s', v:60},{t:'6.5s', v:65}], uiState.apace, function(v){ uiState.apace = v; uiSave(); }));
    goBtn(c, 'Start coherent audio', function(){ startChimeSession('coherent', {pace:({55:5.5,60:6,65:6.5})[uiState.apace], dur:null}, uiState.apace, 'Coherent breathing'); });
  }));

  m.appendChild(card('Physiological sigh \u00b7 Audio (background)', 'Chime-paced sighs on your lock screen \u2014 runs in the background, loops until you stop it.', function(c){
    goBtn(c, 'Start sigh audio', function(){ startChimeSession('sigh', {mode:'open'}, 'sigh', 'Physiological sigh'); });
  }));

  var foot = document.createElement('div'); foot.className = 'm-foot';
  var sb = document.createElement('button'); sb.type = 'button'; sb.className = 'chip' + (soundOn ? ' on' : '');
  sb.textContent = soundOn ? 'Ocean sound: on' : 'Ocean sound: off';
  sb.onclick = function(){ setSound(!soundOn); sb.textContent = soundOn ? 'Ocean sound: on' : 'Ocean sound: off'; sb.className = 'chip' + (soundOn ? ' on' : ''); };
  foot.appendChild(sb);
  m.appendChild(foot);
}

/* ================= boot ================= */
function boot(){
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    document.body.classList.add('reduced-motion');
  }
  seaEl = document.getElementById('sea');
  foamEl = document.getElementById('foam');
  foam2El = document.getElementById('foam2');
  uiLoad();
  buildMenu();
  paintScene();
  document.getElementById('stopBtn').onclick = function(){ endSession(false); };
  document.getElementById('sndBtn').onclick = function(){ setSound(!soundOn); };
  setSound(soundOn);
  try{ blogPull(); }catch(e){}
  document.getElementById('done').onclick = function(){
    document.getElementById('done').className = '';
    document.getElementById('menu').style.display = 'block';
  };
  /* idle ripple so the scene is alive on the menu */
  (function idle(){
    if (!running){ ripT += REDUCED ? 0.002 : 0.01; paintScene(); }
    requestAnimationFrame(idle);
  })();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
</script>
